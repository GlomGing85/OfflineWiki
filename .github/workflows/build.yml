name: Build Android App

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Cache Gradle wrapper & caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew not found, generating wrapper using a temporary Gradle installation"
            sudo apt-get update
            sudo apt-get install -y unzip curl
            GRADLE_VERSION=7.6
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
            sudo mkdir -p /opt/gradle
            sudo unzip -q gradle.zip -d /opt/gradle
            echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
            echo "Installed Gradle ${GRADLE_VERSION} and added to PATH"
            gradle -v
            gradle wrapper --gradle-version ${GRADLE_VERSION}
          else
            echo "gradlew already present"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (assemble release)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build app bundle (optional)
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/**/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/**/*.aab
