name: Build Android App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:   # кнопка "Run workflow" для ручного запуску

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx2g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Gradle wrapper (8.7) if missing
        run: |
          if [ ! -f ./gradlew ]; then
            GRADLE_VERSION=8.7
            curl -sL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o gradle.zip
            sudo unzip -q gradle.zip -d /opt/gradle
            /opt/gradle/gradle-${GRADLE_VERSION}/bin/gradle wrapper --gradle-version ${GRADLE_VERSION}
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (головне — цей встановиться на телефон)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release (опційно, unsigned)
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
