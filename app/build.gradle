// app/build.gradle для OfflineWiki (FlexTeam buildfix)
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.offlinewiki'
    compileSdk 34

    defaultConfig {
        applicationId 'com.offlinewiki'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // підпису нема — release-APK буде unsigned (на телефон НЕ встане).
            // Для тестів використовуй assembleDebug.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        // TopAppBar та інші ExperimentalMaterial3Api — дозволяємо для всього
        // модуля, щоб не розставляти @OptIn по кожному екрану (buildfix v4)
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }
    buildFeatures { compose true }
}

dependencies {
    // Compose (BOM тримає сумісні версії)
    def composeBom = platform('androidx.compose:compose-bom:2024.09.03')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.2'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Навігація + ViewModel
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.5'

    // Room (AppDatabase / DAO)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Корутини/Flow (WikiRepository, сервіси)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Material Components XML-теми (buildfix v3) — потрібні для
    // Theme.Material3.* у res/values*/themes.xml і атрибутів
    // colorPrimary/colorSurface/... (Compose-material3 їх НЕ дає!)
    implementation 'com.google.android.material:material:1.12.0'

    // OkHttp (buildfix v4) — WikiRepository робить завантаження через нього
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Markdown -> HTML (buildfix v4) — commonmark-java.
    // У коді was import org.jetbrains.markdown.Markdown + Markdown.parse(),
    // але такого класу в цій бібліотеці НЕМА (пакет org.intellij.markdown,
    // фасаду Markdown.parse там не існує) → заміна на commonmark, патч у
    // ui/MarkdownRenderer.kt уже застосований.
    implementation 'org.commonmark:commonmark:0.24.0'
}
