// Кореневий build.gradle для OfflineWiki (FlexTeam buildfix v2)
// УВАГА: блок allprojects{repositories} звідси ПРИБРАНО —
// репозиторії тепер централізовані в settings.gradle
// (dependencyResolutionManagement, режим FAIL_ON_PROJECT_REPOS).
// Якщо залишити allprojects тут — Gradle впаде з конфліктом
// "repository was added by build file". Така собі пастка, так.

plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.20' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.20' apply false
    id 'com.google.devtools.ksp' version '2.0.20-1.0.25' apply false
}
